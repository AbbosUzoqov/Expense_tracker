services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boss05
      POSTGRES_DB: tracker_api
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:boss05@db:5432/tracker_api
    depends_on:
      - db

volumes:
  pgdata: